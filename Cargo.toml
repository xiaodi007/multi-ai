[package]
name = "multi-ai"
version = "0.2.2"
edition = "2024"
rust-version = "1.89"
description = "Rust-native multi-model CLI: controlled, auditable cross-model review and delegation for coding agents"
license = "MIT"
repository = "https://github.com/xiaodi007/multi-ai"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
libc = "0.2"
base64 = "0.22"
rmcp = { version = "3.5.0", default-features = false, features = ["server", "transport-io"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
